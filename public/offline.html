<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Koneksi Bermasalah — Operation GWG</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220; color: #e5e7eb; padding: 24px; text-align: center;
  }
  .card { max-width: 340px; }
  .logo { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px; display: grid; place-items: center; background: #11213f; }
  h1 { font-size: 18px; margin: 0 0 8px; color: #f9fafb; }
  p { font-size: 14px; line-height: 1.55; margin: 0 0 20px; color: #9ca3af; }
  button {
    appearance: none; border: 0; cursor: pointer; font-size: 15px; font-weight: 600;
    background: #2563eb; color: #fff; border-radius: 12px; padding: 12px 20px; width: 100%;
  }
  button:active { opacity: .85; }
  .hint { margin-top: 14px; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 14 0M1.4 9.4a15 15 0 0 1 21.2 0"/></svg>
    </div>
    <h1>Koneksi bermasalah</h1>
    <p>Aplikasi tidak dapat memuat karena jaringan terputus atau lambat. Pastikan internet aktif, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
    <p class="hint">Halaman akan otomatis dimuat ulang saat koneksi kembali.</p>
  </div>
  <script>
    // Auto-reload the moment the network comes back.
    window.addEventListener("online", function () { location.reload(); });
    // And retry periodically in case the 'online' event is missed.
    setInterval(function () { if (navigator.onLine) location.reload(); }, 5000);
  </script>
</body>
</html>
